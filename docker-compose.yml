services:
  nextpanel-server:
    build:
      context: ./server
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/nextpanel.db}
    ports:
      - "8080:8080"
    volumes:
      - nextpanel_data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=nextpanel
      - POSTGRES_USER=nextpanel
      - POSTGRES_PASSWORD=nextpanel
    volumes:
      - nextpanel_pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  nextpanel_data:
  nextpanel_pg:
