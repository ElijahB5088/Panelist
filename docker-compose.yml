services:
  panelist-server:
    image: ghcr.io/elijahb5088/panelist-server:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/panelist.db}
    ports:
      - "8080:8080"
    volumes:
      - panelist_data:/app/data
    restart: unless-stopped

  postgres:
    # Reserved for future PostgreSQL support. The application currently uses
    # sqlite3 directly; do not set DATABASE_URL to this service yet.
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=panelist
      - POSTGRES_USER=panelist
      - POSTGRES_PASSWORD=panelist
    volumes:
      - panelist_pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  panelist_data:
  panelist_pg:
