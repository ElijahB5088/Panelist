name: Publish server image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate server image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install and test server
        working-directory: server
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app tests
          python -m pytest -q

      - name: Build image for vulnerability scan
        run: docker build --tag panelist-server:scan ./server

      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name panelist-ci --publish 18080:8080 \
            --env DATABASE_URL=sqlite:///app/data/panelist.db panelist-server:scan
          trap 'docker logs panelist-ci; docker rm --force panelist-ci' EXIT
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:18080/ready
          curl --fail http://127.0.0.1:18080/openapi.json

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          image-ref: panelist-server:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  publish:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/elijahb5088/panelist-server
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
